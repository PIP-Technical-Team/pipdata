schema_version: "1.0"

variables:

  # Numeric range clamping
  educy:
    type: numeric
    recode_type: range_clamp
    label: "Years of education"
    valid_range: [0, 50]
    na_outside: true

  age:
    type: numeric
    recode_type: range_clamp
    label: "Age in years"
    valid_range: [0, 110]
    na_outside: true

  hsize:
    type: numeric
    recode_type: range_clamp
    label: "Household size"
    valid_range: [1, 100]
    na_outside: true

  # Haven-labeled factors (Education)
  educat7:
    type: factor
    recode_type: haven_labels
    label: "Highest level of education completed (7 categories)"
    mapping:
      1: "No education"
      2: "Primary incomplete"
      3: "Primary complete"
      4: "Secondary incomplete"
      5: "Secondary complete"
      6: "Post-secondary"
      7: "Tertiary"

  educat5:
    type: factor
    recode_type: haven_labels
    label: "Highest level of education completed (5 categories)"
    mapping:
      1: "No education"
      2: "Primary incomplete"
      3: "Primary complete but secondary incomplete"
      4: "Secondary complete"
      5: "Some tertiary/post-secondary"

  educat4:
    type: factor
    recode_type: haven_labels
    label: "Highest level of education completed (4 categories)"
    mapping:
      1: "Incomplete secondary"
      2: "General Secondary"
      3: "Special Secondary"
      4: "Tertiary"
      5: "None or incomplete primary"

  # Binary categorical mapping
  gender:
    type: factor
    recode_type: binary_map
    source_column: male
    label: "Gender"
    mapping:
      0: "female"
      1: "male"

  literacy:
    type: factor
    recode_type: binary_map
    label: "Literacy"
    mapping:
      0: "no"
      1: "yes"

  school:
    type: factor
    recode_type: binary_map
    label: "School"
    mapping:
      0: "no"
      1: "yes"

  area:
    type: factor
    recode_type: binary_map
    source_column: urban
    label: "Area"
    mapping:
      0: "rural"
      1: "urban"

  imp_wat_rec:
    type: factor
    recode_type: binary_map
    label: "Access to improved water source"
    mapping:
      0: "no"
      1: "yes"

  imp_san_rec:
    type: factor
    recode_type: binary_map
    label: "Access to improved sanitation"
    mapping:
      0: "no"
      1: "yes"

  electricity:
    type: factor
    recode_type: binary_map
    label: "Access to electricity"
    mapping:
      0: "no"
      1: "yes"

  # Binary from categorical (gender)
  female:
    type: factor
    recode_type: binary_from_categorical
    source_column: gender
    label: "Female"
    mapping:
      0: "Male"
      1: "Female"
    derivation_rules:
      - value: 1
        condition: "gender == 'female'"
      - value: 0
        condition: "gender == 'male'"

  male:
    type: factor
    recode_type: binary_from_categorical
    source_column: gender
    label: "Male"
    mapping:
      0: "Female"
      1: "Male"
    derivation_rules:
      - value: 1
        condition: "gender == 'male'"
      - value: 0
        condition: "gender == 'female'"

  # Binary from categorical (area)
  urban:
    type: factor
    recode_type: binary_from_categorical
    source_column: area
    label: "Urban"
    mapping:
      0: "Rural"
      1: "Urban"
    derivation_rules:
      - value: 1
        condition: "area == 'urban'"
      - value: 0
        condition: "area == 'rural'"

  rural:
    type: factor
    recode_type: binary_from_categorical
    source_column: area
    label: "Rural"
    mapping:
      0: "Urban"
      1: "Rural"
    derivation_rules:
      - value: 1
        condition: "area == 'rural'"
      - value: 0
        condition: "area == 'urban'"

  # Labor Status Variables (Haven Labels)
  lstatus:
    type: factor
    recode_type: haven_labels
    label: "Labor status (7-day ref period)"
    mapping:
      1: "Employed"
      2: "Unemployed"
      3: "Not-in-labor force"

  lstatus_year:
    type: factor
    recode_type: haven_labels
    label: "Labor status (12-month ref period)"
    mapping:
      1: "Employed"
      2: "Unemployed"
      3: "Not-in-labor force"

  # Binary from categorical (lstatus)
  employed:
    type: factor
    recode_type: binary_from_categorical
    source_column: lstatus
    label: "Employed"
    mapping:
      0: "Not employed"
      1: "Employed"
    derivation_rules:
      - value: 1
        condition: "lstatus == 'Employed'"
      - value: 0
        condition: "lstatus == 'Unemployed' | lstatus == 'Not-in-labor force'"

  unemployed:
    type: factor
    recode_type: binary_from_categorical
    source_column: lstatus
    label: "Unemployed"
    mapping:
      0: "Not unemployed"
      1: "Unemployed"
    derivation_rules:
      - value: 1
        condition: "lstatus == 'Unemployed'"
      - value: 0
        condition: "lstatus == 'Employed' | lstatus == 'Not-in-labor force'"

  in_labor_force:
    type: factor
    recode_type: binary_from_categorical
    source_column: lstatus
    label: "Labor force participation"
    mapping:
      0: "Not-in-labor force"
      1: "In labor force"
    derivation_rules:
      - value: 1
        condition: "lstatus == 'Employed' | lstatus == 'Unemployed'"
      - value: 0
        condition: "lstatus == 'Not-in-labor force'"

  # Employment Status - Primary Job (7-day)
  empstat:
    type: factor
    recode_type: haven_labels
    label: "Employment status, primary job (7-day ref period)"
    mapping:
      1: "Paid Employee"
      2: "Non-Paid Employee"
      3: "Employer"
      4: "Self-employed"
      5: "Other workers not classifiable by status"

  empstat_2:
    type: factor
    recode_type: haven_labels
    label: "Employment status, secondary job (7-day ref period)"
    mapping:
      1: "Paid Employee"
      2: "Non-Paid Employee"
      3: "Employer"
      4: "Self-employed"
      5: "Other workers not classifiable by status"

  # Employment Status - Primary Job (12-month)
  empstat_year:
    type: factor
    recode_type: haven_labels
    label: "Employment status, primary job (12-month ref period)"
    mapping:
      1: "Paid Employee"
      2: "Non-Paid Employee"
      3: "Employer"
      4: "Self-employed"
      5: "Other workers not classifiable by status"

  empstat_2_year:
    type: factor
    recode_type: haven_labels
    label: "Employment status, secondary job (12-month ref period)"
    mapping:
      1: "Paid Employee"
      2: "Non-Paid Employee"
      3: "Employer"
      4: "Self-employed"
      5: "Other workers not classifiable by status"

  # Binary from categorical (empstat)
  self_emp:
    type: factor
    recode_type: binary_from_categorical
    source_column: empstat
    label: "Self-employment"
    mapping:
      0: "Not self-employed"
      1: "Self-employed"
    derivation_rules:
      - value: 1
        condition: "empstat == 'Self-employed'"
      - value: 0
        condition: "empstat == 'Paid Employee' | empstat == 'Non-Paid Employee' | empstat == 'Employer' | empstat == 'Other workers not classifiable by status'"

  paid_emp:
    type: factor
    recode_type: binary_from_categorical
    source_column: empstat
    label: "Wage employment"
    mapping:
      0: "Not a paid employee"
      1: "Paid Employee"
    derivation_rules:
      - value: 1
        condition: "empstat == 'Paid Employee'"
      - value: 0
        condition: "empstat == 'Non-Paid Employee' | empstat == 'Employer' | empstat == 'Self-employed' | empstat == 'Other workers not classifiable by status'"

  employer:
    type: factor
    recode_type: binary_from_categorical
    source_column: empstat
    label: "Employer"
    mapping:
      0: "Not an employer"
      1: "Employer"
    derivation_rules:
      - value: 1
        condition: "empstat == 'Employer'"
      - value: 0
        condition: "empstat == 'Paid Employee' | empstat == 'Non-Paid Employee' | empstat == 'Self-employed' | empstat == 'Other workers not classifiable by status'"

  inf_emp:
    type: factor
    recode_type: binary_from_categorical
    source_column: empstat
    label: "Informal employment"
    mapping:
      0: "Not informal"
      1: "Informal"
    derivation_rules:
      - value: 1
        condition: "empstat == 'Non-Paid Employee' | empstat == 'Other workers not classifiable by status'"
      - value: 0
        condition: "empstat == 'Paid Employee' | empstat == 'Employer' | empstat == 'Self-employed'"

  # Industry Classification (4-category) - 7-day
  industrycat4:
    type: factor
    recode_type: haven_labels
    label: "4-category industry classification, primary job (7-day ref period)"
    mapping:
      1: "Agriculture"
      2: "Industry"
      3: "Services"
      4: "Other"

  industrycat4_2:
    type: factor
    recode_type: haven_labels
    label: "4-category industry classification, secondary job (7-day ref period)"
    mapping:
      1: "Agriculture"
      2: "Industry"
      3: "Services"
      4: "Other"

  # Industry Classification (4-category) - 12-month
  industrycat4_year:
    type: factor
    recode_type: haven_labels
    label: "4-category industry classification, primary job (12-month ref period)"
    mapping:
      1: "Agriculture"
      2: "Industry"
      3: "Services"
      4: "Other"

  industrycat4_2_year:
    type: factor
    recode_type: haven_labels
    label: "4-category industry classification, secondary job (12-month ref period)"
    mapping:
      1: "Agriculture"
      2: "Industry"
      3: "Services"
      4: "Other"

  # Binary from categorical (industrycat4)
  emp_agri:
    type: factor
    recode_type: binary_from_categorical
    source_column: industrycat4
    label: "Employment in agriculture sector"
    mapping:
      0: "Not in agriculture"
      1: "Agriculture"
    derivation_rules:
      - value: 1
        condition: "industrycat4 == 'Agriculture'"
      - value: 0
        condition: "industrycat4 == 'Industry' | industrycat4 == 'Services' | industrycat4 == 'Other'"

  emp_indu:
    type: factor
    recode_type: binary_from_categorical
    source_column: industrycat4
    label: "Employment in industry sectors"
    mapping:
      0: "Not in industry"
      1: "Industry"
    derivation_rules:
      - value: 1
        condition: "industrycat4 == 'Industry'"
      - value: 0
        condition: "industrycat4 == 'Agriculture' | industrycat4 == 'Services' | industrycat4 == 'Other'"

  emp_serv:
    type: factor
    recode_type: binary_from_categorical
    source_column: industrycat4
    label: "Employment in services sectors"
    mapping:
      0: "Not in services"
      1: "Services"
    derivation_rules:
      - value: 1
        condition: "industrycat4 == 'Services'"
      - value: 0
        condition: "industrycat4 == 'Agriculture' | industrycat4 == 'Industry' | industrycat4 == 'Other'"

  emp_others:
    type: factor
    recode_type: binary_from_categorical
    source_column: industrycat4
    label: "Employment in other sectors"
    mapping:
      0: "Not in other sectors"
      1: "Other"
    derivation_rules:
      - value: 1
        condition: "industrycat4 == 'Other'"
      - value: 0
        condition: "industrycat4 == 'Agriculture' | industrycat4 == 'Industry' | industrycat4 == 'Services'"

  # Industry Classification (10-category) - 7-day
  industrycat10:
    type: factor
    recode_type: haven_labels
    label: "1 digit industry classification, primary job (7-day ref period)"
    mapping:
      1: "Agriculture, Hunting, Fishing, etc."
      2: "Mining"
      3: "Manufacturing"
      4: "Public Utility Services"
      5: "Construction"
      6: "Commerce"
      7: "Transport and Communications"
      8: "Financial and Business Services"
      9: "Public Administration"
      10: "Other Services, Unspecified"

  industrycat10_2:
    type: factor
    recode_type: haven_labels
    label: "1 digit industry classification, secondary job (7-day ref period)"
    mapping:
      1: "Agriculture, Hunting, Fishing, etc."
      2: "Mining"
      3: "Manufacturing"
      4: "Public Utility Services"
      5: "Construction"
      6: "Commerce"
      7: "Transport and Communications"
      8: "Financial and Business Services"
      9: "Public Administration"
      10: "Other Services, Unspecified"

  # Industry Classification (10-category) - 12-month
  industrycat10_year:
    type: factor
    recode_type: haven_labels
    label: "1 digit industry classification, primary job (12-month ref period)"
    mapping:
      1: "Agriculture, Hunting, Fishing, etc."
      2: "Mining"
      3: "Manufacturing"
      4: "Public Utility Services"
      5: "Construction"
      6: "Commerce"
      7: "Transport and Communications"
      8: "Financial and Business Services"
      9: "Public Administration"
      10: "Other Services, Unspecified"

  industrycat10_2_year:
    type: factor
    recode_type: haven_labels
    label: "1 digit industry classification, secondary job (12-month ref period)"
    mapping:
      1: "Agriculture, Hunting, Fishing, etc."
      2: "Mining"
      3: "Manufacturing"
      4: "Public Utility Services"
      5: "Construction"
      6: "Commerce"
      7: "Transport and Communications"
      8: "Financial and Business Services"
      9: "Public Administration"
      10: "Other Services, Unspecified"

  # Derived Factor Variables (from continuous)
  age_group:
    type: factor
    recode_type: binned_from_continuous
    source_column: age
    label: "Age group (4-category)"
    mapping:
      1: "0–14"
      2: "15–24"
      3: "25–64"
      4: "65+"
    bin_rules:
      - bin: 1
        condition: "age >= 0 & age <= 14"
      - bin: 2
        condition: "age >= 15 & age <= 24"
      - bin: 3
        condition: "age >= 25 & age <= 64"
      - bin: 4
        condition: "age >= 65"

  age_group2:
    type: factor
    recode_type: binned_from_continuous
    source_column: age
    label: "Age group (7-category)"
    mapping:
      1: "0–14"
      2: "15–24"
      3: "25–34"
      4: "35–44"
      5: "45–54"
      6: "55–64"
      7: "65+"
    bin_rules:
      - bin: 1
        condition: "age >= 0 & age <= 14"
      - bin: 2
        condition: "age >= 15 & age <= 24"
      - bin: 3
        condition: "age >= 25 & age <= 34"
      - bin: 4
        condition: "age >= 35 & age <= 44"
      - bin: 5
        condition: "age >= 45 & age <= 54"
      - bin: 6
        condition: "age >= 55 & age <= 64"
      - bin: 7
        condition: "age >= 65"

  hsize_group:
    type: factor
    recode_type: binned_from_continuous
    source_column: hsize
    label: "Household size group (4-category)"
    mapping:
      1: "1 person"
      2: "2–3 persons"
      3: "4–6 persons"
      4: "7+ persons"
    bin_rules:
      - bin: 1
        condition: "hsize == 1"
      - bin: 2
        condition: "hsize >= 2 & hsize <= 3"
      - bin: 3
        condition: "hsize >= 4 & hsize <= 6"
      - bin: 4
        condition: "hsize >= 7"

  # Binary from continuous (age)
  youth:
    type: factor
    recode_type: binary_from_continuous
    source_column: age
    label: "Youth (15–24)"
    mapping:
      0: "Not youth"
      1: "Youth (15–24)"
    derivation_rules:
      - value: 1
        condition: "age >= 15 & age <= 24"
      - value: 0
        condition: "age < 15 | age > 24"

  prime_work_age:
    type: factor
    recode_type: binary_from_continuous
    source_column: age
    label: "Prime working age (25–54)"
    mapping:
      0: "Not prime working age"
      1: "Prime working age (25–54)"
    derivation_rules:
      - value: 1
        condition: "age >= 25 & age <= 54"
      - value: 0
        condition: "age < 25 | age > 54"

  elderly:
    type: factor
    recode_type: binary_from_continuous
    source_column: age
    label: "Elderly (65+)"
    mapping:
      0: "Not elderly"
      1: "Elderly (65+)"
    derivation_rules:
      - value: 1
        condition: "age >= 65"
      - value: 0
        condition: "age < 65"

  wquintile:
    type: factor
    recode_type: quantile_from_continuous
    source_column: welfare
    weight_col: weight
    label: "Welfare quintile"
    mapping:
      1: "quintile1"
      2: "quintile2"
      3: "quintile3"
      4: "quintile4"
      5: "quintile5"
