schema_version: "1.0"

# DLW Data Validation Specification
# Each module defines ordered validation entries.
# Selection semantics are split:
#   - variable_availability: literal prefix passed to is_var_startwith_avail() (startsWith)
#   - numeric_validation / character_validation / validation_group: regex passed to grep()
# Severity is per-check and only honored on not_missing / na_threshold entries
# (the ones that route through validate_cols/validate_rows with explicit error_fun).
# Helper-fixed checks (is_numeric, is_positive, is_character, etc.) ignore severity.

modules:

  gpwg:
    validations:

      weight_availability:
        type: variable_availability
        prefix: "weight"

      welfare_availability:
        type: variable_availability
        prefix: "welfare"

      countrycode:
        type: single_variable
        variable: countrycode
        check: is_character

      urban_check:
        type: categorical_check
        variable: urban
        required: false
        check: check_urban

      hhid_not_missing:
        type: not_missing
        variable: hhid
        severity: warning
        description: "{var} should not be missing"
        condition: hhid_present

      pid_not_missing:
        type: not_missing
        variable: pid
        severity: warning
        description: "{var} should not be missing"
        condition: hhid_and_pid_present

      hhid_pid_uniqueness:
        type: uniqueness
        key_variables: [hhid, pid]
        severity: warning
        description: "No duplicate records in key variables hhid, pid"
        condition: hhid_and_pid_present

      numeric_loop:
        type: numeric_validation
        pattern: "^year$|hsize$|welfshprosperity$"
        labelled_clear: true
        checks:
          - name: is_numeric
            severity: helper
          - name: is_positive
            severity: helper
          - name: not_missing
            severity: warning
            description: "{var} should not be missing"
          - name: na_threshold
            severity: warning
            description: "{var} NAs within %10"

      weight_welfare_loop:
        type: numeric_validation
        pattern: "^welfare|^weight"
        labelled_clear: false
        checks:
          - name: is_numeric
            severity: helper
          - name: is_positive
            severity: helper
          - name: not_missing
            severity: warning
            description: "{var} should not be missing"
          - name: na_threshold
            severity: critical
            description: "{var} NAs within %10"

  group:
    na_threshold_min: 1
    validations:

      weight_availability:
        type: variable_availability
        prefix: "weight"

      welfare_availability:
        type: variable_availability
        prefix: "welfare"

      weight_welfare_loop:
        type: numeric_validation
        pattern: "^welfare|^weight"
        labelled_clear: false
        checks:
          - name: is_numeric
            severity: helper
          - name: is_positive
            severity: helper
          - name: not_missing
            severity: warning
            description: "{var} should not be missing"
          - name: na_threshold
            severity: critical
            description: "{var} NAs within %10"

      numeric_loop:
        type: numeric_validation
        pattern: "urban"
        labelled_clear: true
        checks:
          - name: is_numeric
            severity: helper
          - name: is_positive
            severity: helper
          - name: not_missing
            severity: warning
            description: "{var} should not be missing"
          - name: na_threshold
            severity: warning
            description: "{var} NAs within %10"

      urban_check:
        type: categorical_check
        variable: urban
        required: false
        check: check_urban

      character_loop:
        type: character_validation
        pattern: "code|type$"
        checks:
          - name: is_character
            severity: helper
          - name: not_missing
            severity: warning
            description: "{var} should not be missing"
          - name: na_threshold
            severity: critical
            description: "{var} NAs within %10"

      welfare_type_constraint:
        type: value_constraint
        variable: welfare_type
        required: false
        valid_values: ["C", "I", "income", "consumption"]

  bin:
    na_threshold_min: 1
    validations:

      weight_availability:
        type: variable_availability
        prefix: "weight"

      welfare_availability:
        type: variable_availability
        prefix: "welfare"

      bins_availability:
        type: variable_availability
        prefix: "bins"

      weight_welfare_loop:
        type: numeric_validation
        pattern: "^welfare|^weight"
        labelled_clear: false
        checks:
          - name: is_numeric
            severity: helper
          - name: is_positive
            severity: helper
          - name: not_missing
            severity: warning
            description: "{var} should not be missing"
          - name: na_threshold
            severity: critical
            description: "{var} NAs within %10"

      numeric_loop:
        type: numeric_validation
        pattern: "^year$|share$"
        labelled_clear: true
        checks:
          - name: is_numeric
            severity: helper
          - name: is_positive
            severity: helper
          - name: not_missing
            severity: warning
            description: "{var} should not be missing"
          - name: na_threshold
            severity: warning
            description: "{var} NAs within %10"

      character_loop:
        type: character_validation
        pattern: "code$|verm$|vera$|^region|^country"
        checks:
          - name: is_character
            severity: helper
          - name: not_missing
            severity: warning
            description: "{var} should not be missing"
          - name: na_threshold
            severity: warning
            description: "{var} NAs within %10"

  hist:
    na_threshold_min: 1
    validations:

      weight_availability:
        type: variable_availability
        prefix: "weight"

      welfare_availability:
        type: variable_availability
        prefix: "welfare"

      weight_welfare_loop:
        type: numeric_validation
        pattern: "^welfare|^weight"
        labelled_clear: false
        checks:
          - name: is_numeric
            severity: helper
          - name: is_positive
            severity: helper
          - name: not_missing
            severity: warning
            description: "{var} should not be missing"
          - name: na_threshold
            severity: critical
            description: "{var} NAs within %10"

      numeric_loop:
        type: numeric_validation
        pattern: "urban$|^year$|hsize$|datayear$|type$"
        labelled_clear: true
        checks:
          - name: is_numeric
            severity: helper
          - name: is_positive
            severity: helper
          - name: not_missing
            severity: warning
            description: "{var} should not be missing"
          - name: na_threshold
            severity: warning
            description: "{var} NAs within %10"

      urban_check:
        type: categorical_check
        variable: urban
        required: false
        check: check_urban

      character_loop:
        type: character_validation
        pattern: "code$|survname$"
        checks:
          - name: is_character
            severity: helper
          - name: not_missing
            severity: warning
            description: "{var} should not be missing"
          - name: na_threshold
            severity: critical
            description: "{var} NAs within %10"

  all:
    validations:

      weight_availability:
        type: variable_availability
        prefix: "weight"

      welfare_availability:
        type: variable_availability
        prefix: "welfare"

      age_availability:
        type: variable_availability
        prefix: "age"

      urban_check:
        type: categorical_check
        variable: urban
        required: false
        check: check_urban

      age_check:
        type: single_variable
        variable: age
        required: false
        check: is_greaterequale0
        secondary_check: is_valuebtwn0and110

      male_check:
        type: categorical_check
        variable: male
        required: false
        check: check_gender

      weight_welfare_loop:
        type: numeric_validation
        pattern: "^welfare|^weight"
        labelled_clear: false
        checks:
          - name: is_numeric
            severity: helper
          - name: is_positive
            severity: helper
          - name: not_missing
            severity: warning
            description: "{var} should not be missing"
          - name: na_threshold
            severity: critical
            description: "{var} NAs within %10"

      demog_loop:
        type: validation_group
        pattern: "^male|^educat|^school"
        labelled_clear: false
        checks:
          - name: not_missing
            severity: warning
            description: "{var} should not be missing"
          - name: na_threshold
            severity: critical
            description: "{var} NAs within %10"

  aspire:
    validations:

      hhweight_availability:
        type: variable_availability
        prefix: "hhweight"

      urban_check:
        type: categorical_check
        variable: urban
        required: false
        check: check_urban

      numeric_loop:
        type: numeric_validation
        pattern: "^year$|hsize$"
        labelled_clear: true
        checks:
          - name: is_numeric
            severity: helper
          - name: is_positive
            severity: helper
          - name: not_missing
            severity: warning
            description: "{var} should not be missing"
          - name: na_threshold
            severity: warning
            description: "{var} NAs within %10"

      hhweight_loop:
        type: numeric_validation
        pattern: "hhweight$"
        labelled_clear: false
        checks:
          - name: is_numeric
            severity: helper
          - name: is_positive
            severity: helper
          - name: not_missing
            severity: warning
            description: "{var} should not be missing"
          - name: na_threshold
            severity: critical
            description: "{var} NAs within %10"

  l:
    validations:

      lstatus_availability:
        type: variable_availability
        prefix: "lstatus"

      empstat_availability:
        type: variable_availability
        prefix: "empstat"

      countrycode:
        type: single_variable
        variable: countrycode
        check: is_character

      hhid_not_missing:
        type: not_missing
        variable: hhid
        severity: warning
        description: "{var} should not be missing"
        condition: hhid_present

      pid_not_missing:
        type: not_missing
        variable: pid
        severity: warning
        description: "{var} should not be missing"
        condition: hhid_and_pid_present

      hhid_pid_uniqueness:
        type: uniqueness
        key_variables: [hhid, pid]
        severity: warning
        description: "No duplicate records in key variables hhid, pid"
        condition: hhid_and_pid_present

      numeric_loop:
        type: numeric_validation
        pattern: "^year$|whours$"
        labelled_clear: true
        checks:
          - name: is_numeric
            severity: helper
          - name: is_positive
            severity: helper
          - name: not_missing
            severity: warning
            description: "{var} should not be missing"
          - name: na_threshold
            severity: warning
            description: "{var} NAs within %10"

  skip:
