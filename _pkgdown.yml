url: https://pip-technical-team.github.io/pipdata/
template:
  bootstrap: 5

articles:
- title: Pipeline
  navbar: Pipeline
  contents:
  - articles/PIP-data-pipeline
  - articles/Validating-Data
  - articles/Processing-Data

reference:
- title: Pipeline entry points
  desc: >
    Top-level functions for DLW ingestion, incremental processing, compatible
    stage execution, and read-only planning (see the "Pipeline" articles for
    the narrative walkthrough).
  contents:
  - pipdata_dlw_process
  - pipdata_get_gmd
  - pipdata_validate_gmd
  - pd_run_pipeline
  - pd_process_data
  - pd_deflate_pipeline
  - pd_change_report
- title: Deflation
  desc: >
    Deflates a cleaned survey's welfare values; run as a separate,
    post-hoc step after `pd_process_data()`.
  contents:
  - pd_deflation
  - deflation
- title: Logging
  desc: >
    Summarizes the unified `"pipdata_log"` across DLW acquisition, validation,
    survey cleaning, and deflation with stage-aware warnings.
  contents:
  - log_report
- title: Other functions
  contents:
  - 'starts_with("")'
  - '-pipdata_dlw_process'
  - '-pipdata_get_gmd'
  - '-pipdata_validate_gmd'
  - '-pd_run_pipeline'
  - '-pd_process_data'
  - '-pd_deflate_pipeline'
  - '-pd_change_report'
  - '-pd_deflation'
  - '-deflation'
  - '-log_report'

